# nginx.conf — Web server of the demo deployment (compose.prod.yaml): serves the built frontend (frontend/dist) and
# forwards the API and the sitemap to the Flask backend. Plain HTTP on port 80, any host name (the instance's Elastic
# IP); no HTTPS. Mounted as /etc/nginx/conf.d/default.conf in the nginx container.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Picture uploads: the backend accepts files up to 5 MB (request limit 6 MB); nginx's default is 1 MB.
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # Headers every proxied request carries to Flask.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The backend API (gunicorn in the backend container).
    location /api/ {
        proxy_pass http://backend:5000;
    }

    # The sitemap is built by the backend at /api/sitemap.xml (the same rewrite as the Vite dev proxy).
    location = /sitemap.xml {
        proxy_pass http://backend:5000/api/sitemap.xml;
    }

    root /srv/site;

    # Vite's hashed bundles: their names change with their content, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The single-page app: real files, otherwise index.html (the router handles the URL). index.html is never cached,
    # so a new build shows up on the next load.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
