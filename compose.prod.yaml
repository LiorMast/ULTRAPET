# compose.prod.yaml — Demo deployment on one server (EC2): Postgres + gunicorn Flask + Caddy.
#
#   cd frontend && npm ci && npm run build      build the static site into frontend/dist
#   docker compose -f compose.prod.yaml up -d --build
#   docker compose -f compose.prod.yaml exec backend flask seed
#   docker compose -f compose.prod.yaml exec backend flask import-media
#
# Reads .env (see .env.example): POSTGRES_PASSWORD, SECRET_KEY, SEED_*, and SITE_ADDRESS (the public host name, e.g.
# 3.120.1.2.sslip.io; Caddy gets a free HTTPS certificate for it). Only Caddy publishes ports (80, 443).
name: ultrapet-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: content
      POSTGRES_USER: content
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/database/create-tables.sql:/docker-entrypoint-initdb.d/create-tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      FLASK_APP: app
      DATABASE_URL: postgresql+psycopg://content:${POSTGRES_PASSWORD}@postgres:5432/content
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_CUSTOMER_EMAIL: ${SEED_CUSTOMER_EMAIL:-}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-}
      JWT_COOKIE_SECURE: "1"
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
    volumes:
      - media:/srv/backend/media
      # Seed data at the same paths relative to backend/ as in the repo (used by `flask seed` / `import-media`).
      - ./frontend/src/stubs:/srv/frontend/src/stubs:ro
      - ./legacy/supabase-export:/srv/legacy/supabase-export:ro
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/site:ro
      - caddy_data:/data
    depends_on: [backend]

volumes:
  pgdata:
  media:
  caddy_data:
