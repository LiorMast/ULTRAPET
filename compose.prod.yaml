# compose.prod.yaml — Demo deployment on one server (EC2): Postgres + gunicorn Flask + nginx.
#
#   cd frontend && npm ci && npm run build      build the static site into frontend/dist
#   docker compose -f compose.prod.yaml up -d --build
#   docker compose -f compose.prod.yaml exec backend flask seed
#   docker compose -f compose.prod.yaml exec backend flask import-media
#   docker compose -f compose.prod.yaml exec backend flask build-catalog     the downloadable PDF catalog (after the two above)
#
# Reads .env (see .env.example): POSTGRES_PASSWORD, SECRET_KEY, SEED_*. Plain HTTP only: the site is reached at
# http://<the instance's Elastic IP>/, so JWT_COOKIE_SECURE stays empty. Only nginx publishes a port (80); its
# config is nginx.conf.
name: ultrapet-prod

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: content
      POSTGRES_USER: content
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/database/create-tables.sql:/docker-entrypoint-initdb.d/create-tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      FLASK_APP: app
      DATABASE_URL: postgresql+psycopg://content:${POSTGRES_PASSWORD}@postgres:5432/content
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_CUSTOMER_EMAIL: ${SEED_CUSTOMER_EMAIL:-}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-}
      JWT_COOKIE_SECURE: "${JWT_COOKIE_SECURE:-}"
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
    volumes:
      - media:/srv/backend/media
      # Seed data at the same paths relative to backend/ as in the repo (used by `flask seed` / `import-media`).
      - ./frontend/src/stubs:/srv/frontend/src/stubs:ro
      - ./legacy/supabase-export:/srv/legacy/supabase-export:ro
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/srv/site:ro
    depends_on: [backend]

volumes:
  pgdata:
  media:
