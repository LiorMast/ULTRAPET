# compose.yaml — Local development services: PostgreSQL 17, the Flask backend and Mailpit (a fake mail server).
#
#   docker compose up -d --build        start both (http://localhost:5000/api/health; BACKEND_PORT in .env changes 5000)
#   docker compose exec backend pytest  run the backend tests
#   docker compose exec backend flask seed
#   http://localhost:8025               Mailpit: every email the backend sends in dev lands here (nothing is delivered)
#
# Secrets come from .env (copy .env.example). A fresh `pgdata` volume runs backend/app/database/create-tables.sql once; later
# schema changes are applied with `flask reset-db --yes`. Both services are on the network `internal`
# (= ultrapet_internal), which the postgres MCP server (.mcp.json) joins to reach the database as host `postgres`.
name: ultrapet

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: content
      POSTGRES_USER: content
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/database/create-tables.sql:/docker-entrypoint-initdb.d/create-tables.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U content -d content"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  backend:
    build: ./backend
    command: flask run --debug --host 0.0.0.0 --port 5000
    environment:
      FLASK_APP: app
      DATABASE_URL: postgresql+psycopg://content:${POSTGRES_PASSWORD}@postgres:5432/content
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-never-use-in-production}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_CUSTOMER_EMAIL: ${SEED_CUSTOMER_EMAIL:-}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:-}
      # Plain http in dev; set to 1 behind https so the sign-in cookies are sent over https only.
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-0}
      # The file storage (backend/app/storage.py): "local" (default: files in backend/media, served at /api/media/)
      # or "s3" (the bucket below; see .env.example).
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      # Email (backend/app/mailer.py): dev sends everything to Mailpit, unless .env names a real SMTP server.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      LEADS_NOTIFY_TO: ${LEADS_NOTIFY_TO:-}
      GEOCODER_URL: ${GEOCODER_URL-https://nominatim.openstreetmap.org/search}
    volumes:
      # Source code (reloads on change), plus the seed data at the same paths relative to backend/ as in the repo.
      - ./backend:/srv/backend
      - ./frontend/src/stubs:/srv/frontend/src/stubs:ro
      - ./legacy/supabase-export:/srv/legacy/supabase-export:ro
    ports:
      # The host port: BACKEND_PORT in .env (default 5000), e.g. when another app already uses 5000. Vite's /api proxy
      # and the e2e config read the same setting.
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      # The inbox in the browser; the backend reaches its SMTP port (1025) over the internal network.
      - "127.0.0.1:8025:8025"
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
